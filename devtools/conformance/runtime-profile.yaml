runtime: axtp-cpp-runtime
spec_min: spec/v0.0.2
required_levels:
  - core
  - websocket-jsonrpc
  - endpoint-relay
optional_levels:
  - event
# Deferred until runtime artifacts can be regenerated from a pinned
# advisory-compatible AXTP spec commit/tag rather than an unpinned worktree.
unsupported_levels:
  - capability
  # Framed transport primitives exist, but the runtime does not implement every
  # selected framed-binary profile case (including the STREAM control plane).
  - framed-binary
  # STREAM data framing exists, but open/close lifecycle RPC cases are incomplete.
  - stream
